name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite lanzar la suite a mano desde la pestaña Actions. Sin esto, la única
  # forma de comprobar el estado de `main` es esperar al siguiente cambio: un
  # merge que no llegue a disparar la ejecución deja la rama sin verificar y sin
  # manera de reintentarlo.
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      # Fijada al commit, no a la etiqueta: `@v7` es un puntero que su
      # dueño puede mover, así que quien controle esa etiqueta decide qué
      # código corre aquí. El sha no se mueve. El comentario lleva la
      # versión legible, porque un sha a pelo no dice a qué corresponde.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sintaxis de los scripts
        run: |
          for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
          for f in scripts/*.py; do python3 -m py_compile "$f"; done

      - name: Manifiestos bien formados
        run: |
          for f in .claude-plugin/plugin.json \
                   hooks/hooks.json plantillas/ledger.plantilla.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: La versión del manifiesto está en el CHANGELOG
        run: |
          V=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          grep -q "^## \[$V\]" CHANGELOG.md || {
            echo "plugin.json dice $V y CHANGELOG.md no tiene esa entrada"; exit 1; }

      - name: Regresión
        run: bash tests/prueba.sh
